<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تواصل | Allam Studios</title>
<meta name="description" content="تواصل مع حمزة لمشاريع مونتاج الفيديو والموشن جرافيك.">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#111318">
<link rel="preload" href="/fonts/alexandria-arabic-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/fonts/fonts.css">
<link rel="stylesheet" href="/assets/site.css">
<link rel="alternate" hreflang="en" href="/contact/">
<link rel="alternate" hreflang="ar" href="/ar/contact/">
</head>
<body>

<header class="wrap">
  <nav class="nav" aria-label="القائمة الرئيسية">
    <a class="home" href="/ar/#top"><img src="/brand/allam-studios-mark-white.svg" alt="" width="34" height="27"><span>حمزة علام</span></a>
    <div class="nav-end">
      <ul>
        <li><a href="/ar/work/">أعمالي</a></li>
        <li><a href="/ar/#about">نبذة</a></li>
        <li><a href="/ar/contact/">تواصل</a></li>
      </ul>
      <a class="lang" href="/contact/" lang="en" hreflang="en">English</a>
    </div>
  </nav>
</header>

<main id="top" class="contact-page">
  <section id="contact">
    <div class="wrap split">
      <div>
        <h1>تواصل</h1>
        <p class="intro">لديك فيديو تريد مونتاجه أو فكرة لمشروع موشن جرافيك؟ أرسل لي رسالة.</p>
        <!-- EDIT: your real links -->
        <ul class="contact-links">
          <li><a href="mailto:allamstudiosv@gmail.com" dir="ltr">allamstudiosv@gmail.com</a></li>
          <li><a href="https://www.instagram.com/allam_studios/">إنستغرام</a></li>
        </ul>
      </div>
      <!-- Contact form: posts to the Pages Function (functions/api/contact.js), which stores messages in D1. -->
      <form name="contact" method="POST" action="/api/contact">
        <input type="hidden" name="lang" value="ar">
        <p class="hidden"><label>اترك هذا الحقل فارغًا <input name="bot-field" tabindex="-1" autocomplete="off"></label></p>
        <label>الاسم <input type="text" name="name" autocomplete="name" maxlength="100" required></label>
        <label>البريد الإلكتروني <input type="email" name="email" autocomplete="email" maxlength="254" required></label>
        <label>تفاصيل المشروع <textarea name="message" maxlength="5000" required></textarea></label>
        <button type="submit" class="btn">إرسال الرسالة</button>
      </form>
    </div>
  </section>
<div class="wrap work-actions"><a class="btn" href="/ar/">العودة إلى الرئيسية</a></div>
</main>
<footer><div class="wrap">© 2026 حمزة علام</div></footer>

</body>
</html>

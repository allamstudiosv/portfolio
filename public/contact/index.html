<main id="top" class="contact-page">
  <section id="contact">
    <div class="wrap split">
      <div>
        <h1>Contact</h1>
        <p class="intro">Have a video to edit or a motion graphics project in mind? Send me a message.</p>
        <!-- EDIT: your real links -->
        <ul class="contact-links">
          <li><a href="mailto:allamstudiosv@gmail.com">allamstudiosv@gmail.com</a></li>
          <li><a href="https://www.instagram.com/allam_studios/">Instagram</a></li>
        </ul>
      </div>
      <!-- Contact form: posts to the Pages Function (functions/api/contact.js), which stores messages in D1. -->
      <form name="contact" method="POST" action="/api/contact">
        <p class="hidden"><label>Leave this empty <input name="bot-field" tabindex="-1" autocomplete="off"></label></p>
        <label>Name <input type="text" name="name" autocomplete="name" maxlength="100" required></label>
        <label>Email <input type="email" name="email" autocomplete="email" maxlength="254" required></label>
        <label>Project details <textarea name="message" maxlength="5000" required></textarea></label>
        <button type="submit" class="btn">Send message</button>
      </form>
    </div>
  </section>
</main>
